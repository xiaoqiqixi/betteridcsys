name: aster-billing
x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile.backend
  image: aster-billing-api:local
  environment: &app-env
    APP_MODE: production
    APP_ORIGIN: ${APP_ORIGIN:?Set an HTTPS origin in deploy/.env}
    LISTEN_ADDR: 0.0.0.0:8080
    PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-payment.disabled}
    EMAIL_PROVIDER: ${EMAIL_PROVIDER:-email.disabled}
    TRUSTED_PROXY_CIDRS: 172.30.42.2/32
    SESSION_SECRET_FILE: /run/secrets/session_secret
    MYSQL_DSN_FILE: /run/secrets/mysql_dsn
    # Explicit exception for this host-local, internal-only Docker database network.
    # Remove for a remote DB; use certificate-verified TLS in its DSN instead.
    MYSQL_ALLOW_INSECURE: "true"
  secrets: [session_secret, mysql_dsn]
  # No public egress. Add reviewed, controlled egress only when a provider is integrated.
  networks: [data]
  read_only: true
  tmpfs: ["/tmp:size=32m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: aster
      MYSQL_USER: aster_migrator
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets: [mysql_password, mysql_root_password, mysql_runtime_password]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/mysql-init-runtime.sh:/docker-entrypoint-initdb.d/10-runtime-user.sh:ro
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 --silent']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    # Intentionally no published DB port.
  migrate:
    <<: *app
    command: [-migrate]
    environment:
      <<: *app-env
      MYSQL_DSN_FILE: /run/secrets/mysql_migration_dsn
    secrets: [session_secret, mysql_migration_dsn]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
    healthcheck: {disable: true}
  api:
    <<: *app
    networks:
      data: {}
      proxy: {ipv4_address: 172.30.42.3}
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    image: aster-billing-web:local
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:8080"]
    networks:
      edge: {ipv4_address: 172.30.43.2}
      proxy: {ipv4_address: 172.30.42.2}
    depends_on:
      api: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  bootstrap:
    <<: *app
    profiles: [ops]
    command: [-create-user]
    environment:
      <<: *app-env
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_NAME: ${BOOTSTRAP_NAME:-Administrator}
      BOOTSTRAP_ROLE: admin
      BOOTSTRAP_PASSWORD_FILE: /run/secrets/bootstrap_password
    secrets: [session_secret, mysql_dsn, bootstrap_password]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"
    healthcheck: {disable: true}
networks:
  edge:
    ipam:
      config: [{subnet: 172.30.43.0/29, gateway: 172.30.43.1}]
  proxy:
    internal: true
    ipam:
      config: [{subnet: 172.30.42.0/29, gateway: 172.30.42.1}]
  data: {internal: true}
volumes:
  mysql_data: {}
secrets:
  session_secret: {file: ./secrets/session_secret}
  mysql_dsn: {file: ./secrets/mysql_dsn}
  mysql_password: {file: ./secrets/mysql_password}
  mysql_runtime_password: {file: ./secrets/mysql_runtime_password}
  mysql_migration_dsn: {file: ./secrets/mysql_migration_dsn}
  mysql_root_password: {file: ./secrets/mysql_root_password}
  bootstrap_password: {file: ./secrets/bootstrap_password}
