# Include this server block inside nginx's http {} context.
# Replace the domain/certificate paths. This sample terminates TLS directly.
# If another proxy is in front, review its exact trust chain separately.
server {
  listen 443 ssl;
  server_name billing.example.com;
  ssl_certificate /etc/letsencrypt/live/billing.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/billing.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  root /opt/aster/current/web;
  index index.html;
  client_max_body_size 64k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  # Enable a reviewed HSTS policy only after the domain's HTTPS setup is verified.
  location /api/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_buffering off;
  }
  location ~ ^/(healthz|readyz)$ {
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    access_log off;
  }
  location /assets/ { try_files $uri =404; expires 7d; }
  location = /index.html { expires -1; }
  location ~ /\. { deny all; }
  location / { try_files $uri $uri/ /index.html; }
}
