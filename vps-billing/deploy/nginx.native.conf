# Include ONCE inside the distribution nginx.conf http {} context.
# Dedicated single-server deployment, direct TLS: no CDN/front proxy trust.
# Requires nginx >= 1.19.4 for ssl_reject_handshake. Replace billing.example.com
# and certificate paths, review conflicting distro default sites, then nginx -t.
# No service is installed/reloaded and no certificate is obtained by this template.
# Never add broad real_ip_header/set_real_ip_from trust inherited from http {}:
# $remote_addr must be the direct client socket peer in this topology.

# Exclude query strings, cookies, authorization and request bodies from access logs.
log_format aster_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time';

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  server_tokens off;
  access_log off;
  return 444;
}

server {
  listen 80;
  listen [::]:80;
  server_name billing.example.com;
  server_tokens off;
  access_log off;
  # Fixed hostname, never reflect an arbitrary Host into a redirect.
  return 308 https://billing.example.com$request_uri;
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name _;
  server_tokens off;
  # Protocol selection can use the default server before SNI selection.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_early_data off;
  ssl_session_tickets off;
  ssl_reject_handshake on;
  access_log off;
  return 444;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name billing.example.com;
  ssl_certificate /etc/letsencrypt/live/billing.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/billing.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_early_data off;
  ssl_session_tickets off;
  server_tokens off;
  # Also reject a mismatched HTTP Host after a valid TLS SNI handshake.
  if ($host != billing.example.com) { return 444; }

  # The release and current symlink are root-owned, read-only to nginx and aster.
  # Never serve /opt/aster/current itself: only its compiled web subdirectory.
  root /opt/aster/current/web;
  index index.html;
  autoindex off;
  client_max_body_size 64k;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  access_log /var/log/nginx/aster.access.log aster_access;
  error_log /var/log/nginx/aster.error.log warn;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  # The production API sends its own HSTS header. Before public traffic, verify
  # the domain's certificate/renewal and choose a consistent site-wide HSTS policy.

  location /api/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 20s;
    proxy_read_timeout 30s;
    proxy_buffering off;
    proxy_cache off;
  }

  location ~ ^/(healthz|readyz)$ {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_cache off;
    access_log off;
  }

  # expires does not replace the server's security add_header directives.
  # Assets are versioned by Vite; HTML must be revalidated after a release switch.
  location /assets/ { try_files $uri =404; expires 7d; }
  location = /index.html { expires -1; }
  location ~ /\. { deny all; }
  location / { try_files $uri $uri/ /index.html; }
}
