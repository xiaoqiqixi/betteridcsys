name: Controller and KVM node development checks

on:
  push:
    branches: ['main']
    paths:
      - 'aster-cloud/**'
      - 'vps-billing/backend/controllerapi/**'
      - 'vps-billing/backend/internal/controllers/**'
      - '.github/workflows/cloud.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-unit:
    name: Linux unit and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Unit regressions (real MySQL is a separate required job)
        working-directory: aster-cloud
        run: |
          set -euo pipefail
          go test -mod=readonly -race -count=1 -v -timeout=10m ./...
          go vet -mod=readonly ./...
          CGO_ENABLED=0 go build -mod=readonly -trimpath -buildvcs=false ./cmd/aster-controller ./cmd/aster-node ./cmd/aster-network ./cmd/aster-billing-plugin
      - name: Workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/cloud.yml

  native-ovs-parser:
    name: Native OVS parser and encoder (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install parser only (no OVS service or kernel datapath)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y openvswitch-common libvirt-clients libxml2-utils
          /usr/bin/ovs-ofctl --version
      - name: Parse production flows and inspect real encoded meters; no skips
        working-directory: aster-cloud
        env:
          ASTER_NATIVE_OVS_PARSER: '1'
        run: |
          set -euo pipefail
          go test -mod=readonly -race -count=1 -timeout=3m -json ./internal/fabric -run '^TestNativeOVSParser' | tee native-ovs-parser.jsonl
          python3 - <<'PYTEST'
          import json
          events = [json.loads(line) for line in open('native-ovs-parser.jsonl')]
          assert not any(e['Action'] in ('skip', 'fail') for e in events), 'native parser gate skipped or failed'
          expected = {'TestNativeOVSParserFlows', 'TestNativeOVSParserMeters'}
          passed = {e.get('Test') for e in events if e['Action'] == 'pass'}
          assert expected <= passed, 'required native parser tests did not execute'
          PYTEST
      - name: Validate exact public NIC filter with distribution libvirt schema
        working-directory: aster-cloud
        run: |
          set -euo pipefail
          go build -mod=readonly -trimpath -buildvcs=false -o "$RUNNER_TEMP/aster-node-schema" ./cmd/aster-node
          "$RUNNER_TEMP/aster-node-schema" --print-public-network-filter aster-public-ipv4 > "$RUNNER_TEMP/aster-public-ipv4.xml"
          virt-xml-validate "$RUNNER_TEMP/aster-public-ipv4.xml" nwfilter
          # XML validation only: do not start libvirt, define filters or touch host networking.

  native-nat:
    name: Native NAT packet flow and revocation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install namespace tools (no network service)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y iproute2 nftables conntrack
          /usr/sbin/nft --version
      - name: Real isolated namespace traffic; no skips or host rule changes
        working-directory: aster-cloud
        run: |
          set -euo pipefail
          go test -mod=readonly -race -c -o "$RUNNER_TEMP/aster-nat.test" ./internal/fabric
          sudo -- env ASTER_NATIVE_NAT=1 "$RUNNER_TEMP/aster-nat.test" -test.v -test.count=1 -test.timeout=3m -test.run '^TestNativeNAT' | tee native-nat.log
          grep -q '^--- PASS: TestNativeNATPacketFlowAndRevocation ' native-nat.log
          grep -q '^--- PASS: TestNativeNATInternetEgressAndRevocation ' native-nat.log
          for marker in PUBLIC_INGRESS_DEFAULT_DENY_AND_OUTBOUND_REPLY_CONFIRMED PUBLIC_INGRESS_RELATED_ICMP_BOTH_DIRECTIONS_CONFIRMED PUBLIC_INGRESS_EXACT_SOURCE_PORT_AND_ICMP_CONFIRMED PUBLIC_INGRESS_ALL_PUBLIC_CIDR_AND_PROTECTED_FLOOR_CONFIRMED PUBLIC_INGRESS_REVOKE_CONNTRACK_AND_FINAL_READBACK_CONFIRMED PUBLIC_INGRESS_SHARED_NAT_BOUNDARY_CONFIRMED; do
            grep -q "$marker" native-nat.log
          done
          if grep -qE -- '--- (SKIP|FAIL):' native-nat.log; then
            echo 'Native NAT gate must not skip or fail.' >&2; exit 1
          fi

  management-ui:
    name: Vue management console checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install locked console dependencies
        working-directory: aster-cloud/frontend
        run: npm ci --ignore-scripts
      - name: Check, test and build the real-API console
        working-directory: aster-cloud/frontend
        run: |
          set -euo pipefail
          npm run typecheck
          npm run format:check
          npm test
          npm run build
          npm audit --audit-level=high

  native-mysql:
    name: Independent controller MySQL acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Prepare disposable native runner
        run: bash vps-billing/deploy/ci/prepare-native-runner.sh
      - name: Real isolated MySQL, race and static binaries
        run: RUNNER_TEMP="$ASTER_NATIVE_FIXTURE_ROOT" bash vps-billing/deploy/ci/mysql-native.sh -- bash aster-cloud/deploy/ci/check.sh
      - name: Go vulnerability gate
        working-directory: aster-cloud
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -format=text -show=version,verbose ./...
      - name: Remove only owned native scratch
        if: always()
        run: |
          if [[ -n ${ASTER_NATIVE_FIXTURE_ROOT:-} ]]; then
            [[ $ASTER_NATIVE_FIXTURE_ROOT =~ ^/run/aster-native\.[A-Za-z0-9]{8}$ ]]
            sudo rm -rf -- "$ASTER_NATIVE_FIXTURE_ROOT"
          fi

  network-browser:
    name: Real MySQL network management browser acceptance
    runs-on: ubuntu-24.04
    # First measured tool provisioning took 21m48s. Keep the actual fixture and
    # page-operation deadlines unchanged; allow bounded distribution download time.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Build the real management frontend
        working-directory: aster-cloud/frontend
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
      - name: Prepare disposable native runner
        run: bash vps-billing/deploy/ci/prepare-native-runner.sh
      - name: Install pinned private browser tools
        run: |
          set -euo pipefail
          umask 077
          tools_root=$(mktemp -d "$ASTER_NATIVE_FIXTURE_ROOT/browser-tools.XXXXXXXX")
          npm install --prefix "$tools_root" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.64.0
          export PLAYWRIGHT_BROWSERS_PATH="$tools_root/browsers"
          node "$tools_root/node_modules/playwright/cli.js" install --with-deps firefox
          sudo apt-get install --no-install-recommends -y libnss3-tools
          printf 'PLAYWRIGHT_MODULE_DIR=%s\nPLAYWRIGHT_BROWSERS_PATH=%s\n' "$tools_root/node_modules" "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
      - name: Strict TLS desktop/mobile UI and durable MySQL history; no skips
        run: RUNNER_TEMP="$ASTER_NATIVE_FIXTURE_ROOT" bash vps-billing/deploy/ci/mysql-native.sh -- bash aster-cloud/deploy/ci/network-browser.sh
      - name: Publish only screenshots and sanitized acceptance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-management-browser
          path: |
            aster-cloud/artifacts/network-browser/*.png
            aster-cloud/artifacts/network-browser/report.json
            aster-cloud/artifacts/network-browser/tls.json
            aster-cloud/artifacts/network-browser/fixture.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove only owned native scratch, browser profile and test certificates
        if: always()
        run: |
          if [[ -n ${ASTER_NATIVE_FIXTURE_ROOT:-} ]]; then
            [[ $ASTER_NATIVE_FIXTURE_ROOT =~ ^/run/aster-native\.[A-Za-z0-9]{8}$ ]]
            sudo rm -rf -- "$ASTER_NATIVE_FIXTURE_ROOT"
          fi
