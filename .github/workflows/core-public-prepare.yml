name: Published Core preparation acceptance

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact reviewed source of the normal public v0.5.10 release; not latest'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-core-prepare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-prepare:
    name: Published Core assets and real prepare (${{ matrix.os }})
    if: github.repository == 'xiaoqiqixi/betteridcsys' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Trusted main controls only; no downloaded code execution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Anonymous six-asset download and production prepare, no host apply
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_OS: ${{ matrix.os }}
          READ_ONLY_METADATA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The token only authenticates public metadata reads. A different,
          # credential-free Official client downloads every asset. It enters
          # the preparer through stdin, not a command line, file or artifact.
          # shellcheck disable=SC2024
          printf '%s' "$READ_ONLY_METADATA_TOKEN" | sudo -n /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 \
            /usr/bin/python3 -I vps-billing/deploy/ci/public-core-prepare.py --source-sha "$SOURCE_SHA" \
            > "$RUNNER_TEMP/public-core-prepare.json"
          python3 - "$RUNNER_TEMP/public-core-prepare.json" "$SOURCE_SHA" "$TARGET_OS" <<'PY'
          import json, sys
          proof = json.load(open(sys.argv[1]))
          assert proof['passed'] is True and proof['source_sha'] == sys.argv[2]
          assert proof['version'] == '0.5.10' and len(proof['assets']) == 6
          assert proof['ubuntu'] == {'ubuntu-22.04': '22.04', 'ubuntu-24.04': '24.04'}[sys.argv[3]]
          assert all(proof[k] is True for k in ('anonymous_asset_download', 'production_prepare', 'source_and_integrity_verified', 'local_receipt_verified', 'owned_resources_removed'))
          assert proof['host_install'] is False and proof['program_executed'] is False
          assert proof['service_action'] == proof['database_action'] == 'none'
          PY
      - name: Retain only sanitized postpublication proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-core-prepare-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-core-prepare.json
          if-no-files-found: warn
          overwrite: false
          retention-days: 7
