name: Isolated HTTP performance baseline

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/performance.yml'
      - 'vps-billing/backend/**'
      - 'vps-billing/deploy/ci/performance*'
      - 'vps-billing/deploy/ci/test_performance*'
      - 'vps-billing/deploy/ci/mysql-native.sh'
      - 'vps-billing/deploy/ci/mysql-distribution.json'
      - 'vps-billing/deploy/ci/prepare-native-runner.sh'
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: 'Optional full ancestor commit SHA; overrides the fixed measured baseline for same-harness baseline/candidate/baseline'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: http-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    if: github.repository == 'xiaoqiqixi/betteridcsys' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check performance workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/performance.yml
      - name: Prepare disposable native runner
        run: bash vps-billing/deploy/ci/prepare-native-runner.sh
      - name: Measure the fixed synthetic HTTP profile
        # Both binaries include the current test harness. Baseline production
        # source and harness hashes remain separate; this is not a release build.
        env:
          PERF_BASELINE_SHA: ${{ github.event.inputs.baseline_sha || '58961d4ee6710a7bb249b98bbe0141227c3ffa79' }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          output="$RUNNER_TEMP/http-performance"
          arguments=(--allow-isolated-runner --repo-root "$GITHUB_WORKSPACE" --output "$output")
          if [[ -n $PERF_BASELINE_SHA ]]; then arguments+=(--baseline-sha "$PERF_BASELINE_SHA"); fi
          shopt -s nullglob
          existing=("$ASTER_NATIVE_FIXTURE_ROOT"/aster-mysql.* "$ASTER_NATIVE_FIXTURE_ROOT"/aster-performance.*)
          [[ ${#existing[@]} == 0 ]]
          result=0
          ASTER_NATIVE_COMMAND_STOP_SECONDS=20 RUNNER_TEMP="$ASTER_NATIVE_FIXTURE_ROOT" \
            timeout --signal=TERM --kill-after=60s 1200s bash vps-billing/deploy/ci/mysql-native.sh -- \
            bash vps-billing/deploy/ci/performance-native.sh "${arguments[@]}" || result=$?
          # mysql-native.sh's EXIT trap has completed before this receipt. Do
          # not claim its server/fixture cleanup from inside the benchmark.
          python3 -I - "$output" "$result" "$ASTER_NATIVE_FIXTURE_ROOT" "$GITHUB_SHA" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys

          output = Path(sys.argv[1])
          root = Path(sys.argv[3])
          if not re.fullmatch(r'/run/aster-native\.[A-Za-z0-9]{8}', str(root)):
              raise SystemExit('PERFORMANCE_CLEANUP_ERROR=ROOT')
          info = root.lstat()
          if not stat.S_ISDIR(info.st_mode) or info.st_uid != os.geteuid():
              raise SystemExit('PERFORMANCE_CLEANUP_ERROR=OWNER')
          removed = not any(path.name.startswith(('aster-mysql.', 'aster-performance.')) for path in root.iterdir())
          processes_stopped = True
          prefix = os.fsencode(str(root) + '/')
          for process in Path('/proc').iterdir():
              if not process.name.isdecimal() or int(process.name) == os.getpid():
                  continue
              try:
                  if process.stat().st_uid == os.geteuid() and prefix in (process / 'cmdline').read_bytes():
                      processes_stopped = False
              except FileNotFoundError:
                  pass
              except OSError:
                  processes_stopped = False
          if not output.exists():
              output.mkdir(mode=0o700)
          output_info = output.lstat()
          if not stat.S_ISDIR(output_info.st_mode) or output_info.st_uid != os.geteuid() or stat.S_IMODE(output_info.st_mode) != 0o700:
              raise SystemExit('PERFORMANCE_CLEANUP_ERROR=OUTPUT')
          benchmark_cleanup = False
          try:
              path = output / 'runner-cleanup.json'
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd) as stream:
                  info = os.fstat(stream.fileno())
                  if not stat.S_ISREG(info.st_mode) or info.st_uid != os.geteuid() or info.st_nlink != 1 or info.st_size > 2048:
                      raise ValueError()
                  receipt = json.load(stream)
              benchmark_cleanup = (set(receipt) == {'schema', 'source_sha', 'benchmark_exit_code', 'owned_scratch_removed'} and
                  receipt['schema'] == 'aster.http-performance-runner-cleanup/1' and receipt['source_sha'] == sys.argv[4] and
                  receipt['benchmark_exit_code'] == 0 and receipt['owned_scratch_removed'] is True)
          except (OSError, ValueError, TypeError):
              pass
          passed = int(sys.argv[2]) == 0 and removed and processes_stopped and benchmark_cleanup
          receipt = {'schema': 'aster.http-performance-fixture-cleanup/1', 'source_sha': sys.argv[4],
              'fixture_command_exit_code': int(sys.argv[2]), 'fixture_directories_removed': removed,
              'owned_processes_stopped': processes_stopped, 'benchmark_cleanup_verified': benchmark_cleanup, 'passed': passed}
          fd = os.open(output / 'fixture-cleanup.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(fd, 'w') as stream:
              json.dump(receipt, stream, sort_keys=True)
              stream.write('\n')
          print('PERFORMANCE_FIXTURE_CLEANUP=' + ('passed' if passed else 'failed'))
          print('PERFORMANCE_FIXTURE_CLEANUP_JSON ' + json.dumps(receipt, sort_keys=True, separators=(',', ':')))
          raise SystemExit(0 if passed else 1)
          PY
      - name: Retain validated synthetic performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: http-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/http-performance/performance.json
            ${{ runner.temp }}/http-performance/runner-cleanup.json
            ${{ runner.temp }}/http-performance/fixture-cleanup.json
          if-no-files-found: ignore
          retention-days: 14
          overwrite: false
      - name: Remove owned native runner scratch
        if: always()
        run: |
          if [[ -n ${ASTER_NATIVE_FIXTURE_ROOT:-} ]]; then
            [[ $ASTER_NATIVE_FIXTURE_ROOT =~ ^/run/aster-native\.[A-Za-z0-9]{8}$ ]]
            [[ -d $ASTER_NATIVE_FIXTURE_ROOT && ! -L $ASTER_NATIVE_FIXTURE_ROOT ]]
            [[ $(stat -c %u "$ASTER_NATIVE_FIXTURE_ROOT") == "$(id -u)" ]]
            sudo rm -rf --one-file-system -- "$ASTER_NATIVE_FIXTURE_ROOT"
          fi
